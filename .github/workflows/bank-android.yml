name: Банк Erachain — Android APK

on:
  push:
    paths:
      - 'bank/**'
      - '.github/workflows/bank-android.yml'
    tags:
      - 'bank-v*'
  pull_request:
    paths:
      - 'bank/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bank
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bank/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты сервера банка
        run: npm test

      - name: Синхронизация веб-части с Android
        run: npx cap sync android

      - name: Сборка APK
        working-directory: bank/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../erachain-bank.apk

      - uses: actions/upload-artifact@v4
        with:
          name: erachain-bank-apk
          path: bank/erachain-bank.apk
          retention-days: 30

      - name: Публикация релиза (для тегов bank-v*)
        if: startsWith(github.ref, 'refs/tags/bank-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" erachain-bank.apk --title "Банк Erachain $GITHUB_REF_NAME" --notes "Android-приложение Банк Erachain (отладочная сборка)."
